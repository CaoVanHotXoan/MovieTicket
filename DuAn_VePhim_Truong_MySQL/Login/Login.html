<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Login</title>
    <!-- Liên kết tới file CSS -->
    <link rel="stylesheet" href="Login.css">
    <link rel="stylesheet" href="../responsive.css">
</head>

<body class="login-page">
    <!-- Lớp background dùng để tạo hiệu ứng làm mờ -->
    <div class="background-blur"></div>

    <!-- Nút quay về trang chủ -->
    <a href="../index.html" class="back-home">
        <span>&larr;</span> Quay về trang chủ
    </a>

    <!-- Khung chính giữa trang chứa các form -->
    <div class="login-container">
        <!-- FORM ĐĂNG NHẬP -->
        <form id="login-form">
            <h2>Đăng Nhập</h2>
            <!-- Bảng text nhập tài khoản -->
            <div class="input-group">
                <input type="text" id="login-username" placeholder="Tài khoản (Email hoặc SĐT)" required>
            </div>
            <!-- Bảng text nhập mật khẩu -->
            <div class="input-group">
                <input type="password" id="login-password" placeholder="Mật khẩu" required>
            </div>
            <!-- Các nút bấm bên dưới -->
            <div class="button-group">
                <button type="submit" class="btn">Đăng Nhập</button>
                <button type="button" class="btn" id="show-register-btn">Đăng Ký</button>
            </div>
            <!-- Dòng quên mật khẩu ở dưới cùng -->
            <a href="#" class="forgot-password">Quên Mật Khẩu</a>
        </form>

        <!-- FORM ĐĂNG KÝ (Mặc định được ẩn đi) -->
        <form id="register-form" style="display: none;">
            <h2>Đăng Ký Tài Khoản</h2>
            <!-- Bảng text nhập Gmail hoặc số điện thoại -->
            <div class="input-group">
                <input type="text" id="reg-username" placeholder="Gmail hoặc Số ĐT" required>
            </div>
            <!-- Bảng text nhập mật khẩu -->
            <div class="input-group">
                <input type="password" id="reg-password" placeholder="Mật khẩu (ít nhất 8 kí tự)" required>
            </div>
            <div class="button-group">
                <button type="submit" class="btn">Tạo Tài Khoản</button>
                <button type="button" class="btn" id="show-login-btn">Quay lại</button>
            </div>
        </form>
    </div>

    <!-- Liên kết tới file JavaScript -->
    <script src="../script.js"></script>
    <script src="../api.js"></script>
</body>

</html>
